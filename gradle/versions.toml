# Version catalog is a central place for you to declare and version dependencies
# https://docs.gradle.org/current/userguide/platforms.html#sub:version-catalog
# https://docs.gradle.org/current/userguide/platforms.html#sub::toml-dependencies-format

[versions]
# core
kotlin = "2.1.10"
java = "23"
# Kotlinx and kotlin Ecosystem
kotlinxDatetime = "0.6.2"
kotlinxSerializationJSON = "1.8.0"
kotlinxCoroutines = "1.10.1"

# convention
spotless = "6.25.0"
ktlint = "1.2.1"
build-config = "5.3.5"
detekt = "1.23.6"
dependency-health = "1.32.0"
owasp = "9.1.0"
kover = "0.7.6"
jacoco = "0.8.12"
license-check = "2.7"
pit-gradle = "1.15.0"
pit-junit5 = "1.2.1"

# testing
junit-jupiter = "5.10.2"
mockk = "1.13.10"
kotest = "5.8.1"
assertk = "0.28.0"
turbine = "1.1.0"
testcontainers = "1.19.7"
coroutines-test = "1.10.1"
mockito-kotlin = "5.2.1"
wiremock = "3.4.2"

# Libraries can be bundled together for easier import
[bundles]
kotlinxEcosystem = ["kotlinxDatetime", "kotlinxSerialization", "kotlinxCoroutines"]
testing = ["junit-jupiter-api", "junit-jupiter-params", "mockk"]
kotest = ["kotest-runner-junit5", "kotest-assertions-core", "kotest-property"]
testcontainers = ["testcontainers-junit-jupiter", "testcontainers-postgresql", "testcontainers-kafka"]
testing-extended = ["junit-jupiter-api", "junit-jupiter-params", "mockk", "assertk", "kotlinx-coroutines-test", "turbine"]


[libraries]
# Add Kotlin Gradle plugin reference
kotlinGradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlinxDatetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }
kotlinxSerialization = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJSON" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJSON" }
kotlinxCoroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }

# Testing dependencies
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit-jupiter" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit-jupiter" }
junit-jupiter-params = { module = "org.junit.jupiter:junit-jupiter-params", version.ref = "junit-jupiter" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }

# Additional testing dependencies
kotest-runner-junit5 = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotest-property = { module = "io.kotest:kotest-property", version.ref = "kotest" }
assertk = { module = "com.willowtreeapps.assertk:assertk", version.ref = "assertk" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines-test" }
mockito-kotlin = { module = "org.mockito.kotlin:mockito-kotlin", version.ref = "mockito-kotlin" }

# Testcontainers
testcontainers-junit-jupiter = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql", version.ref = "testcontainers" }
testcontainers-kafka = { module = "org.testcontainers:kafka", version.ref = "testcontainers" }


# WireMock for API testing
wiremock = { module = "org.wiremock:wiremock", version.ref = "wiremock" }


[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
java = { id = "java", version.ref = "java" }
kotlinPluginSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

# Add convention plugins
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
dependency-health = { id = "com.autonomousapps.dependency-analysis", version.ref = "dependency-health" }
owasp-dependencies = { id = "org.owasp.dependencycheck", version.ref = "owasp" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
build-config = { id = "com.github.gmazzo.buildconfig", version.ref = "build-config" }
